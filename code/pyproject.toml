[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionrag-frozen"
version = "0.1.0"
description = "Frozen DecisionRAG A4/B3/C4/D3/E3/F1/G2 experiment"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

